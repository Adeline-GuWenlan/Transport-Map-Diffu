name: expB_cifar10_dit-b2_pixel-dinov2
seed: 0
device: cuda
data:
  dataset: cifar10
  root: data/cifar10
  image_size: 32
  channels: 3
  num_classes: 10
  normalize: minus_one_one
  hflip: true
  train_split: train
  heldout_split: test
  num_workers: 8
model:
  backbone: dit
  input_size: 32
  patch_size: 2
  in_channels: 3
  out_channels: 3
  depth: 12
  hidden_size: 768
  num_heads: 12
  mlp_ratio: 4.0
  learn_sigma: false
  class_dropout_prob: 0.0
  timestep_mode: constant
  timestep_value: 999
  output: direct
loss:
  beta: 1.0
  interaction_weight: 0.5
  grouping: per_class
  samples_per_datapoint: 1
  statistic: u
  norm: double_where
  distance_dtype: float32
  feature:
    encoder: dinov2_vits14
    img_size: 224
    weight: 1.0
    scale: auto
    scale_n_per_class: 200
batch:
  sampler: class_stratified
  classes_per_batch: 8
  n_per_class: 64
optim:
  name: adamw
  lr: 0.0001
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.0
  warmup_steps: 5000
  schedule: constant
  grad_clip_norm: 2.0
  ema_decay: 0.9999
train:
  max_steps: 30000
  snapshot_steps:
  - 5000
  - 10000
  - 20000
  - 30000
  grad_chunk: 128
  precision: bf16
  tf32: true
  compile: false
  log_every: 100
  ckpt_every: 1000
  sample_every: 5000
eval:
  every: 5000
  energy_distance:
    space: pixel
    beta: 1.0
    n_per_class: 1000
    baselines:
    - noise
    - zero
    - class_mean
    - train
    - other_class
    also_in_inception_space: true
  nearest_neighbour:
    n_generated: 10000
    space:
    - pixel
    - inception
  fid:
    enabled: true
    implementation: clean-fid
    mode: legacy_tensorflow
    dataset_name: cifar10
    dataset_res: 32
    dataset_split: train
    num_gen: 10000
    num_gen_final: 50000

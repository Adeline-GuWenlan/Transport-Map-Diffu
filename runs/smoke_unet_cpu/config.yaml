name: smoke_unet_cpu
seed: 0
device: cpu
num_threads: 7
data:
  dataset: cifar10
  root: data/cifar10
  image_size: 32
  channels: 3
  num_classes: 10
  normalize: minus_one_one
  hflip: true
  train_split: train
  heldout_split: test
  num_workers: 2
model:
  backbone: unet
  input_size: 32
  in_channels: 3
  out_channels: 3
  base_channels: 64
  channel_mult:
  - 1
  - 2
  - 2
  num_res_blocks: 1
  attention_resolutions:
  - 16
  mid_attention: true
  num_heads: 4
  dropout: 0.0
  emb_dim: 256
  timestep_mode: constant
  timestep_value: 999
  output: direct
  patch_size: 4
loss:
  beta: 1.0
  interaction_weight: 0.5
  grouping: per_class
  samples_per_datapoint: 1
  statistic: u
  norm: double_where
  distance_dtype: float32
batch:
  sampler: class_stratified
  classes_per_batch: 8
  n_per_class: 8
optim:
  name: adamw
  lr: 0.0002
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.0
  warmup_steps: 500
  schedule: constant
  grad_clip_norm: 2.0
  ema_decay: 0.999
train:
  max_steps: 40000
  time_limit_min: 15
  precision: fp32
  log_every: 50
  ckpt_every: 1000
  sample_every: 1000
eval:
  every: 1000
  energy_distance:
    space: pixel
    beta: 1.0
    n_per_class: 500
    n_per_class_final: 1000
    baselines:
    - noise
    - zero
    - class_mean
    - train
    - other_class
  nearest_neighbour:
    n_generated: 1000
    space: pixel
  fid:
    enabled: true
    implementation: clean-fid
    mode: legacy_tensorflow
    dataset_name: cifar10
    dataset_res: 32
    dataset_split: train
    num_gen: 5000

# Experiment A: 30k-step GPU baseline. DiT-B/2 + CIFAR-10 + the original pixel energy score (stage 1 loss),
# everything else as configs/base_gpu.yaml (stage 2 choices). Changes vs base_gpu.yaml, all marked "# exp":
#   max_steps 30k; weight snapshots at 5k/10k/20k/30k (evaluated after training: samples, FID-10k, pixel D1,
#   Inception and DINOv2 feature D1); in-loop pixel D1 every 5k; exact two-pass chunked gradient (grad_chunk) because
#   N = 512 does not fit in 48 GB in one pass (CPU estimate 2026-11-10: ~111 MiB of saved activations per sample
#   under bf16 autocast -> ~55 GiB at N = 512). The loss and its gradient are unchanged by chunking.
# Submit: scripts/exp_gpu.slurm (see its header).
name: expA_cifar10_dit-b2_pixel
seed: 0
device: cuda

data:
  dataset: cifar10                  # 50k train / 10k test, 32x32 RGB, 10 balanced classes
  root: data/cifar10
  image_size: 32
  channels: 3
  num_classes: 10
  normalize: minus_one_one
  hflip: true                       # DiT's only augmentation
  train_split: train
  heldout_split: test
  num_workers: 8

model:
  backbone: dit                     # third_party/DiT/models.py (commit ed81ce2), unmodified
  input_size: 32
  patch_size: 2                     # 16x16 = 256 tokens, the same token count as DiT-*/2 on 256px latents
  in_channels: 3
  out_channels: 3
  depth: 12                         # DiT-B
  hidden_size: 768
  num_heads: 12
  mlp_ratio: 4.0
  learn_sigma: false
  class_dropout_prob: 0.0
  timestep_mode: constant
  timestep_value: 999
  output: direct
  # measured: 129.7 M params, 23.0 GMACs/sample forward (matches DiT paper Table 4: 23.01 for DiT-B/2)
  # cheaper fallback: DiT-S/2 (depth 12, hidden 384, heads 6): 32.6 M params, 6.05 GMACs

loss:
  beta: 1.0
  interaction_weight: 0.5
  grouping: per_class
  samples_per_datapoint: 1
  statistic: u
  norm: double_where
  distance_dtype: float32           # distances in fp32 even under bf16 autocast

batch:
  sampler: class_stratified
  classes_per_batch: 8
  n_per_class: 64                   # N = 512 data points, M = 512 network passes per step (64 per class as Drifting)

optim:
  name: adamw
  lr: 1.0e-4                        # DiT's verified value for this backbone
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0
  warmup_steps: 5000
  schedule: constant
  grad_clip_norm: 2.0               # binds on every step (measured pre-clip norm 3-67 on the smoke model); log it
  ema_decay: 0.9999

train:
  max_steps: 30000                  # exp: ~300 epochs of CIFAR-10 at N = 512; requeue-safe via resume
  snapshot_steps: [5000, 10000, 20000, 30000]   # exp: weights-only copies, evaluated after training
  grad_chunk: 128                   # exp: exact two-pass gradient, activations of 128 samples at a time
  precision: bf16                   # autocast for the network only
  tf32: true
  compile: false                    # optional; turn on after the first run works
  log_every: 100
  ckpt_every: 1000                  # exp: resume point (requeue loses < 1000 steps)
  sample_every: 5000

eval:
  every: 5000                       # exp: in-loop held-out pixel D1 (raw + EMA)
  energy_distance:
    space: pixel
    beta: 1.0
    n_per_class: 1000               # all 1000 test images per class
    baselines: [noise, zero, class_mean, train, other_class]
    also_in_inception_space: true   # D_1 on the 2048-d pool features computed for FID
  nearest_neighbour:
    n_generated: 10000
    space: [pixel, inception]
  fid:
    enabled: true
    implementation: clean-fid       # MIT; precomputed stats downloaded from www.cs.cmu.edu/~clean-fid/stats/
    mode: legacy_tensorflow         # comparable with published CIFAR-10 FIDs; also report mode: clean
    dataset_name: cifar10
    dataset_res: 32
    dataset_split: train
    num_gen: 10000                  # during training (FID-10k); 50000 at the end (FID-50k), EMA weights
    num_gen_final: 50000

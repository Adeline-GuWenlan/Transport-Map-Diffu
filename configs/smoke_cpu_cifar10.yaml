# Optional second CPU smoke run: same model and optimizer as smoke_cpu.yaml, on CIFAR-10.
# Run only if smoke_cpu.yaml works and time remains; it is the bridge to configs/base_gpu.yaml.
name: smoke_cpu_cifar10_dit-t4
seed: 0
device: cpu
num_threads: 8

data:
  dataset: cifar10                  # 50k train / 10k test, 32x32 RGB, 10 balanced classes
  root: data/cifar10
  image_size: 32
  channels: 3
  num_classes: 10
  normalize: minus_one_one
  hflip: true                       # as DiT; CIFAR-10 is left-right symmetric in distribution
  train_split: train
  heldout_split: test
  num_workers: 2

model:
  backbone: dit
  input_size: 32
  patch_size: 4
  in_channels: 3
  out_channels: 3
  depth: 6
  hidden_size: 256
  num_heads: 4
  mlp_ratio: 4.0
  learn_sigma: false
  class_dropout_prob: 0.0
  timestep_mode: constant
  timestep_value: 999
  output: direct
  # measured: 7.41 M params, 0.319 GMACs/sample forward, 0.138 s per train step at batch 64 (8 threads)

loss:
  beta: 1.0
  interaction_weight: 0.5
  grouping: per_class
  samples_per_datapoint: 1
  statistic: u
  norm: double_where
  distance_dtype: float32

batch:
  sampler: class_stratified
  classes_per_batch: 8
  n_per_class: 8

optim:
  name: adamw
  lr: 2.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0
  warmup_steps: 500
  schedule: constant
  grad_clip_norm: 2.0               # binds on every step (measured pre-clip norm 3-67 on the smoke model); log it
  ema_decay: 0.999

train:
  max_steps: 40000
  time_limit_min: 60
  precision: fp32
  log_every: 50
  ckpt_every: 1000
  sample_every: 2000

eval:
  every: 2000
  energy_distance:
    space: pixel
    beta: 1.0
    n_per_class: 500
    n_per_class_final: 1000
    baselines: [noise, zero, class_mean, train, other_class]
    # measured (docs/stage2_checks/results/data_scale_cifar10.json, mean over classes, n=1000):
    #   noise 9.22 | zero 17.85 | class-mean point mass 14.78 | wrong class 2.14 | train 0.005
  nearest_neighbour:
    n_generated: 1000
    space: pixel
  fid:
    enabled: true                   # indicative only on CPU (few samples); label it so
    implementation: clean-fid
    mode: legacy_tensorflow
    dataset_name: cifar10
    dataset_res: 32
    dataset_split: train
    num_gen: 5000

# UNet twin of Experiment B (unet chain, docs/experiments_unet.md). Identical to configs/expB_cifar10_dit-b2_pixel-dinov2.yaml
# except name, these comments and the model block (fairness contract: docs/unet_config_diff.txt). DiT header below.
# Experiment B: feature-loss ablation. Identical to configs/expA_cifar10_dit-b2_pixel.yaml (model, data, budget,
# seed) plus a frozen-encoder energy-score term: L = L_pixel + lambda * L_feat, L_feat the same class-grouped
# unbiased estimator on DINOv2 ViT-S/14 CLS features (src/tmap/features.py). Inherited from A:
# everything else as configs/base_gpu.yaml (stage 2 choices). Changes vs base_gpu.yaml, all marked "# exp":
#   max_steps 30k; weight snapshots at 5k/10k/20k/30k (evaluated after training: samples, FID-10k, pixel D1,
#   Inception and DINOv2 feature D1); in-loop pixel D1 every 5k; exact two-pass chunked gradient (grad_chunk) because
#   N = 512 does not fit in 48 GB in one pass (CPU estimate 2026-11-10: ~111 MiB of saved activations per sample
#   under bf16 autocast -> ~55 GiB at N = 512). The loss and its gradient are unchanged by chunking.
# Submit: scripts/exp_gpu.slurm (see its header).
name: expB_cifar10_unet_pixel-dinov2
seed: 0
device: cuda

data:
  dataset: cifar10                  # 50k train / 10k test, 32x32 RGB, 10 balanced classes
  root: data/cifar10
  image_size: 32
  channels: 3
  num_classes: 10
  normalize: minus_one_one
  hflip: true                       # DiT's only augmentation
  train_split: train
  heldout_split: test
  num_workers: 8

model:
  backbone: unet                    # src/tmap/unet.py: De Bortoli et al. 2025 (arXiv 2502.02483) App. I.2 U-Net
  input_size: 32
  in_channels: 3                    # z ~ N(0, I), 3x32x32 only (one-step map: no x_t concat)
  out_channels: 3
  base_channels: 256                # App. I.2
  channel_mult: [1, 2, 2, 2]        # App. I.2: 256/512/512/512 at 32/16/8/4 px
  num_res_blocks: 2                 # App. I.2, per level (down and up path)
  attention_resolutions: [16]       # App. I.2: attention at the second level (16 px for CIFAR-10)
  mid_attention: true               # App. I.2: attention in the bottleneck
  num_heads: 8                      # App. I.2
  dropout: 0.0                      # assumption: App. I.2 gives no rate; DiT uses none
  emb_dim: 1024                     # assumption: 4 x base channels (paper silent)
  timestep_mode: constant
  timestep_value: 999               # as the DiT map
  output: direct                    # last conv zero-initialised, F == 0 at step 0 (assumption, as DiT's adaLN-Zero)
  patch_size: 2                     # not used by the UNet: grid of tmap.evaluate's blockiness metric, = DiT-B/2's patch
  # measured: 140.0 M params, 20.0 GMACs/sample forward (DiT-B/2: 129.7 M, 23.0)

loss:
  beta: 1.0
  interaction_weight: 0.5
  grouping: per_class
  samples_per_datapoint: 1
  statistic: u
  norm: double_where
  distance_dtype: float32           # distances in fp32 even under bf16 autocast
  feature:                          # exp B
    encoder: dinov2_vits14          # self-supervised, not the FID network (Inception), so FID stays non-circular
    img_size: 224                   # 32 px -> 224 px bicubic, 16x16 patches of 14 px
    weight: 1.0                     # assumption: equal footing with the pixel term after scaling
    scale: auto                     # lambda = weight * (mean same-class pixel dist / mean same-class feature dist)
    scale_n_per_class: 200          # on the first 200 train images per class; stored in the checkpoint

batch:
  sampler: class_stratified
  classes_per_batch: 8
  n_per_class: 64                   # N = 512 data points, M = 512 network passes per step (64 per class as Drifting)

optim:
  name: adamw
  lr: 1.0e-4                        # DiT's verified value for this backbone
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0
  warmup_steps: 5000
  schedule: constant
  grad_clip_norm: 2.0               # binds on every step (measured pre-clip norm 3-67 on the smoke model); log it
  ema_decay: 0.9999

train:
  max_steps: 30000                  # exp: ~300 epochs of CIFAR-10 at N = 512; requeue-safe via resume
  snapshot_steps: [5000, 10000, 20000, 30000]   # exp: weights-only copies, evaluated after training
  grad_chunk: 128                   # exp: exact two-pass gradient, activations of 128 samples at a time
  precision: bf16                   # autocast for the network only
  tf32: true
  compile: false                    # optional; turn on after the first run works
  log_every: 100
  ckpt_every: 1000                  # exp: resume point (requeue loses < 1000 steps)
  sample_every: 5000

eval:
  every: 5000                       # exp: in-loop held-out pixel D1 (raw + EMA)
  energy_distance:
    space: pixel
    beta: 1.0
    n_per_class: 1000               # all 1000 test images per class
    baselines: [noise, zero, class_mean, train, other_class]
    also_in_inception_space: true   # D_1 on the 2048-d pool features computed for FID
  nearest_neighbour:
    n_generated: 10000
    space: [pixel, inception]
  fid:
    enabled: true
    implementation: clean-fid       # MIT; precomputed stats downloaded from www.cs.cmu.edu/~clean-fid/stats/
    mode: legacy_tensorflow         # comparable with published CIFAR-10 FIDs; also report mode: clean
    dataset_name: cifar10
    dataset_res: 32
    dataset_split: train
    num_gen: 10000                  # during training (FID-10k); 50000 at the end (FID-50k), EMA weights
    num_gen_final: 50000
